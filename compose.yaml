services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      API_TOKEN: ${API_TOKEN:?Add your Telegram bot token to .env first}
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
